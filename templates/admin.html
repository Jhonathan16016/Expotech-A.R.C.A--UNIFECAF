<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart House inteligênte!">
    <title>ADM A.R.C.A</title>
    <style>body{font-family: Arial}</style>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
</head>
<body>
    <audio id="bgm" loop>
        <source src="{{url_for('static', filename='audios/djartmusic-my-8-bit-hero-301280.mp3')}}" type="audio/mpeg">
    </audio>
    <div class="espaco">
        <span class="estrela" style="top: 5%;left: 85%; animation-delay: 0s;"></span>
        <span class="estrela" style="top: 15%;left: 60%; animation-delay: 2.5s;"></span>
        <span class="estrela" style="top: 0%;left: 95%; animation-delay: 5s;"></span>
    </div>
    <div class="card2 vidro larga">
        <h2>Administração</h2>
        <div class="aparelhos">
            {%for u in usuarios%}
                <div class="aparelho">
                    <div class="topo">
                        <span class="nome-aparelho">{{u['usuario_nome']}}</span>
                        <span class="selo {{'on'if u['usuario_posicao'] == 'ADMINISTRADOR' else 'off'}}">{{u['usuario_posicao']}}</span>
                    </div>
                </div>
            {%endfor%}
        </div>
        <a class="butao" href="{{url_for('menu')}}">Voltar</a>
    </div>
    <script src="{{url_for('static', filename='script.js')}}"></script>
    <button id="mute-btn">🔊</button>
    <script>
        const music = document.getElementById('bgm');
        const muteBtn=document.getElementById('mute-btn');
        music.volume = 0.03;
        document.addEventListener("click",()=>{
            music.play();
        }, {once: true});
        muteBtn.addEventListener("click",()=>{
            music.muted= !music.muted;
            if (music.muted){
                muteBtn.textContent = '🔈';
            }else{
                muteBtn.textContent='🔊';
            }
        })
    </script>
</body>
</html>
