<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Smart House inteligênte!">
    <title>{{dados['nome']}}</title>
    <style>body{font-family: Arial}</style>
    <link rel="stylesheet" href="{{url_for('static',filename='style.css')}}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body class="pausa">
    <div class="espaco">
        <span class="estrela" style="top: 5%;left: 85%; animation-delay: 0s;"></span>
        <span class="estrela" style="top: 15%;left: 60%; animation-delay: 2.5s;"></span>
        <span class="estrela" style="top: 0%;left: 95%; animation-delay: 5s;"></span>
    </div>
    <div class="card2 vidro larga sem-blur">
        <h2 style="color: white; font-family: 'Press Start 2P', cursive;">{{dados['nome']}}</h2>
        <div class="tela-jogo">
            <div id="game"></div>
        </div>
        <a class="butao sem-ani" href="{{url_for('arcade')}}">Voltar</a>
    </div>

    <script>
        EJS_player = '#game';
        EJS_core = '{{ dados["core"] }}';
        EJS_gameUrl = "{{ url_for('static', filename='roms/' + dados['arquivo']) }}";
        EJS_pathtodata = "{{ url_for('static', filename='emulatorjs/data/') }}";
    </script>
    <script src="{{ url_for('static', filename='emulatorjs/data/loader.js') }}"></script>
</body>
</html>
